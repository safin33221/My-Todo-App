<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Todo App</title>
</head>

<body>

    <div class="max-w-sm mx-auto mt-10 p-5 rounded-lg flex flex-col item-center bg-gray-50 justify-center border">
        <h1 class="text-2xl font-bold text-center ">
            My Todo Application
        </h1>

        <div class="flex gap-5 item-center justify-center mt-5">
            <input id="taskInput" type="text" placeholder="Enter Your task"
                class="border border-gray rounded-lg outline-none px-4 ">

            <button id="addBtn" class="bg-black text-white px-3 rounded-lg  " >
                Add
            </button>
       
        </div>

        <!-- todo list  -->

        <ul id="totoList"></ul>
    </div>


    <!-- script  Start-->
    <script>
        const taskInput = document.getElementById("taskInput")
        const addBtn = document.getElementById("addBtn")
        const todoList = document.getElementById("totoList")

        let todos = []

        function renderTodos() {

            todoList.innerHTML = ""

            todos.forEach((todo, index) => {

                todoList.innerHTML += `
            <li class="mt-2 ">
                <div class="flex justify-bwteen">
                    <div>
                        <input type="checkbox"
                        ${todo.completed ? "checked" : ""}
                        
                        onChange="completedTodo(${index})"
                        />  
                        <span class="${todo.completed ? "line-through" : ""}">
                            ${todo.title}    
                        </span>
                    </div>



                    <button
                    onclick=(deleteTodo(${index})) 
                        class="bg-red-500 px-4 rounded-lg">
                        del
                    </button>
                </div>    
            </li>
            `
            })
        }


        addBtn.addEventListener("click", () => {
            const task = taskInput.value
            todos.push({
                title: task,
                completed: false
            })
            localStorage.setItem("todos", JSON.stringify(todos))
            renderTodos()

        })

        // ====================================
        // 5. Complete Todo
        // ====================================

        function completedTodo(index) {
            todos[index].completed = !todos[index].completed
            localStorage.setItem("todos", JSON.stringify(todos))
            renderTodos()
        }

        function deleteTodo(index) {
            console.log(index);
            todos.splice(index, 1)
            renderTodos()
            localStorage.setItem("todos", JSON.stringify(todos))
        }




        const savedTodos = localStorage.getItem("todos")
        // console.log("get todos from ls", savedTodos);
        if (savedTodos) {
            todos = JSON.parse(savedTodos)
        }




        renderTodos()
    </script>
    <!-- script  end-->
</body>

</html>
